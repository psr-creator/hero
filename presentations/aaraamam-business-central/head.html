<title>Aaraamam Back of House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FFFFFF; --ground:#E9EDF0; --band:#F4F6F8;
  --ink:#0F1418; --ink2:#44505A; --muted:#6E7B85;
  --rule:#DCE2E6; --rule2:#C2CBD1;
  --red:#C1272D; --redsoft:#FBEAEA;
  --amber:#B87400; --ambersoft:#FCF0DA; --amberpure:#F2A31C;
  --teal:#0A6B59; --tealsoft:#DFF0EC;
  --dark:#12171C; --ondark:#F0F3F5; --ondark2:#98A5AE;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ground); color:var(--ink); margin:0;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"Helvetica Neue",Arial,sans-serif; margin:0; line-height:1.06; letter-spacing:-.025em; text-wrap:balance}
p{margin:0}
a{color:inherit}

/* ============ deck mechanics ============ */
.deck{scroll-snap-type:y mandatory; height:100svh; overflow-y:auto; overflow-x:hidden}
.slide{
  scroll-snap-align:start; scroll-snap-stop:always;
  min-height:100svh; background:var(--paper); border-bottom:1px solid var(--rule);
  display:flex; flex-direction:column; justify-content:center;
  padding:82px 5vw 74px; position:relative;
}
.slide.dk{background:var(--dark); color:var(--ondark); border-bottom-color:#000}
.slide.bnd{background:var(--band)}
.inner{width:100%; max-width:1120px; margin:0 auto}

/* persistent chrome */
.chrome{
  position:fixed; inset:0 0 auto 0; z-index:40; height:56px; display:flex; align-items:center; gap:14px;
  padding:0 clamp(16px,5vw,44px); background:rgba(255,255,255,.86); backdrop-filter:blur(9px);
  border-bottom:1px solid var(--rule); pointer-events:none;
}
.chrome .g{display:flex; align-items:center; gap:9px}
.chrome img.gl{height:24px; width:auto; display:block}
.chrome .gn{font-family:Archivo; font-weight:700; font-size:12px; letter-spacing:.02em; color:var(--ink)}
.chrome .sep{flex:1}
.chrome .client{display:flex; align-items:center; gap:9px}
.chrome .client .lbl{font-family:"IBM Plex Mono"; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.chrome img.cl{height:30px; width:auto; display:block}
@media(max-width:640px){ .chrome .gn{display:none} .chrome .client .lbl{display:none} }

.pager{
  position:fixed; right:clamp(14px,4vw,32px); bottom:20px; z-index:41;
  display:flex; align-items:center; gap:12px; pointer-events:auto;
}
.pager .cnt{font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.1em; color:var(--muted);
  background:rgba(255,255,255,.9); border:1px solid var(--rule); border-radius:100px; padding:5px 12px}
.pager button{
  width:34px; height:34px; border-radius:100px; border:1px solid var(--rule); background:rgba(255,255,255,.9);
  color:var(--ink); cursor:pointer; font-size:15px; line-height:1; display:grid; place-items:center; padding:0;
}
.pager button:hover{background:var(--ink); color:#fff; border-color:var(--ink)}
.pager button:focus-visible{outline:2px solid var(--red); outline-offset:2px}
.rail{position:fixed; left:0; top:0; height:3px; background:var(--red); z-index:45; width:0; transition:width .25s ease}
@media print{ .chrome,.pager,.rail{display:none} .deck{height:auto;overflow:visible} .slide{min-height:0;page-break-after:always} }

/* ============ slide furniture ============ */
.tag{
  font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.19em; text-transform:uppercase;
  color:var(--red); display:flex; align-items:center; gap:11px; margin-bottom:20px;
}
.tag::after{content:""; flex:1; height:1px; background:var(--rule); max-width:140px}
.dk .tag{color:var(--amberpure)} .dk .tag::after{background:#2A3238}
h2.st{font-size:clamp(30px,4.6vw,52px); font-weight:700}
.dk h2.st{color:var(--ondark)}
.say{font-size:clamp(17px,1.6vw,20px); color:var(--ink2); max-width:66ch; margin-top:18px; line-height:1.55}
.dk .say{color:var(--ondark2)}
.fine{font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); line-height:1.65; margin-top:22px}
.dk .fine{color:var(--ondark2)}

/* ============ cover ============ */
.cov{padding:0; display:grid; grid-template-rows:1fr auto; grid-template-columns:100%; justify-content:stretch; align-items:stretch; overflow:hidden; background:#12171C}
.cov .shot{position:absolute; inset:0; background:#1B2228 center/cover no-repeat; z-index:0}
.cov .shot.none{background:linear-gradient(155deg,#33404A 0%,#1B2228 55%,#0E1317 100%)}
.cov .scrim{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(95deg,rgba(8,11,14,.95) 0%,rgba(8,11,14,.88) 34%,rgba(8,11,14,.56) 66%,rgba(8,11,14,.24) 100%);
}
.cov .inner{position:relative; z-index:2; align-self:center; padding:96px 5vw 44px; max-width:calc(1120px + 10vw)}
.cov h1{font-size:clamp(38px,6.6vw,74px); font-weight:800; letter-spacing:-.038em; color:#FFFFFF}
.cov h1 b{color:var(--amberpure); font-weight:800}
.cov .kick{font-family:"IBM Plex Mono"; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.62); margin-bottom:26px}
.cov .say{margin-top:26px; font-size:clamp(17px,1.9vw,22px); color:rgba(255,255,255,.84); max-width:50ch}
.cov .foot{position:relative; z-index:2; background:var(--paper); padding:22px 5vw}
.cov .footin{
  max-width:1120px; margin:0 auto;
  display:flex; align-items:flex-end; gap:clamp(24px,6vw,72px); flex-wrap:wrap;
}
.cov .foot .col .l{font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
.cov .foot .lock{display:flex; align-items:center; gap:12px}
.cov .foot .lock img.gl{height:46px; width:auto}
.cov .foot .lock .t{font-family:Archivo; font-weight:700; font-size:17px; line-height:1.2}
.cov .foot .lock .t span{display:block; font-family:"IBM Plex Mono"; font-weight:400; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.cov .foot img.cl{height:46px; width:auto; display:block}

/* ============ stats ============ */
.stats{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-top:36px}
.stats div{background:var(--paper); padding:22px 18px}
.stats .v{font-family:Archivo; font-weight:700; white-space:nowrap; font-size:clamp(20px,2.3vw,29px); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.stats .k{font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:6px; line-height:1.45}
@media(max-width:900px){ .stats{grid-template-columns:repeat(3,1fr)} }
@media(max-width:520px){ .stats{grid-template-columns:repeat(2,1fr)} }

/* ============ reference wall ============ */
.refwall{
  background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:clamp(20px,3vw,34px);
  display:grid; grid-template-columns:repeat(8,1fr); gap:clamp(20px,3vw,34px) 18px; align-items:center; justify-items:center; margin-top:34px;
}
.refwall img.ref{max-height:38px; width:auto; max-width:100%; filter:grayscale(1); opacity:.74}
@media(max-width:900px){ .refwall{grid-template-columns:repeat(4,1fr)} }
@media(max-width:520px){ .refwall{grid-template-columns:repeat(2,1fr)} .refwall img.ref{max-height:30px} }

/* ============ statement slide ============ */
.stmt .pre{font-size:clamp(17px,2vw,23px); color:var(--ondark2); max-width:34ch; line-height:1.45}
.stmt h2{font-size:clamp(36px,6.4vw,76px); font-weight:800; letter-spacing:-.035em; margin-top:26px; max-width:17ch; color:var(--ondark)}
.stmt h2 b{color:var(--amberpure); font-weight:800}
.stmt .stripes{position:absolute; right:0; top:0; bottom:0; width:min(30vw,320px); opacity:.10}
@media(max-width:760px){ .stmt .stripes{display:none} }

/* ============ tiles ============ */
.grid8{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:38px}
@media(max-width:960px){ .grid8{grid-template-columns:repeat(2,1fr)} }
@media(max-width:540px){ .grid8{grid-template-columns:1fr} }
.tl{background:var(--paper); border:1px solid var(--rule); border-top:3px solid var(--tc,var(--amber)); border-radius:2px; padding:20px 19px 22px}
.bnd .tl{background:var(--paper)}
.tl b{display:block; font-family:Archivo; font-size:17px; font-weight:700; letter-spacing:-.015em; line-height:1.15}
.tl span{display:block; font-size:14.5px; color:var(--ink2); margin-top:10px; line-height:1.5}

.g3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:32px}
@media(max-width:900px){ .g3{grid-template-columns:1fr} }
.card{background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:22px}
.card .ct{font-family:Archivo; font-weight:700; font-size:17px; letter-spacing:-.01em}
.card .cb{font-size:14.5px; color:var(--ink2); margin-top:10px; line-height:1.6}
.card .cb em{font-style:normal; color:var(--ink); font-weight:600}

/* ============ figures ============ */
.fig{background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:22px 24px 18px; margin-top:30px}
.fig .fb{overflow-x:auto}
.fig svg{display:block; min-width:480px; width:100%; height:auto}
.fig .fc{margin-top:14px; padding-top:12px; border-top:1px solid var(--rule); font-family:"IBM Plex Mono"; font-size:11px; color:var(--muted); line-height:1.6}

/* ============ certificate ============ */
.certrow{display:grid; grid-template-columns:1.05fr 1fr; gap:20px; margin-top:22px; align-items:stretch}
@media(max-width:900px){ .certrow{grid-template-columns:1fr} }
.certrow .ans{
  background:var(--tealsoft); border:1px solid var(--teal); border-radius:3px; padding:22px 24px;
  display:flex; flex-direction:column; justify-content:center;
}
.certrow .ans .lb{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--teal)}
.certrow .ans b{display:block; font-family:Archivo; font-size:clamp(18px,1.9vw,23px); font-weight:700; letter-spacing:-.015em; margin-top:12px}
.certrow .ans p{font-size:14.5px; color:var(--ink2); margin-top:11px; line-height:1.55; max-width:44ch}
.certrow .doc{background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:10px; display:flex; flex-direction:column}
.certrow .doc .sheet{
  flex:1; min-height:250px; border:1px solid var(--rule2); border-radius:2px; overflow:hidden;
  background:#fff center/contain no-repeat; cursor:zoom-in; display:grid; place-items:center;
}
.certrow .doc .sheet.none{
  cursor:default; background:repeating-linear-gradient(45deg,#F7F9FA 0 9px,#EDF1F3 9px 18px);
  font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; padding:20px;
}
.certrow .doc .cap{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.06em; color:var(--muted); margin-top:10px; line-height:1.5}

#lb{position:fixed; inset:0; z-index:90; background:rgba(8,11,14,.93); display:none; place-items:center; padding:4vh 4vw}
#lb[data-open="1"]{display:grid}
#lb img{max-width:100%; max-height:88vh; width:auto; height:auto; background:#fff; border-radius:3px; display:block}
#lb .x{
  position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:100px; cursor:pointer;
  border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; font-size:18px; line-height:1; display:grid; place-items:center;
}
#lb .hint{position:absolute; bottom:18px; left:0; right:0; text-align:center; font-family:"IBM Plex Mono"; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.5)}

/* ============ two column compare ============ */
.cmp{border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-top:34px; background:var(--paper)}
.cmp .hd{display:grid; grid-template-columns:1fr 1fr; background:var(--band); border-bottom:1px solid var(--rule2)}
.cmp .hd div{padding:12px 20px; font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.cmp .hd div:first-child{color:var(--red)} .cmp .hd div:last-child{color:var(--teal)}
.cmp .rw{display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--rule)}
.cmp .rw:last-child{border-bottom:0}
.cmp .rw>div{padding:18px 20px; font-size:14.5px; line-height:1.55}
.cmp .rw>div:first-child{border-right:1px solid var(--rule); color:var(--ink2)}
.cmp .rw>div:last-child{color:var(--ink)}
.cmp .rw b{display:block; font-family:Archivo; font-size:15px; font-weight:700; margin-bottom:6px; letter-spacing:-.01em}
.cmp .rw>div:last-child b{color:var(--teal)}
@media(max-width:820px){
  .cmp .hd{display:none}
  .cmp .rw{grid-template-columns:1fr}
  .cmp .rw>div:first-child{border-right:0; border-bottom:1px dashed var(--rule2)}
}

/* ============ mechanism list ============ */
.mech{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-top:32px}
.mech .m{background:var(--paper); padding:16px 18px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start}
.mech .m .n{font-family:"IBM Plex Mono"; font-size:11px; color:var(--red); padding-top:3px}
.mech .m b{display:block; font-family:Archivo; font-size:15px; font-weight:700; letter-spacing:-.01em}
.mech .m span{display:block; font-size:13.8px; color:var(--ink2); margin-top:5px; line-height:1.5}
@media(max-width:820px){ .mech{grid-template-columns:1fr} }

/* ============ roadmap ============ */
.road{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-top:34px}
.road .ph{background:var(--paper); padding:20px 16px; display:flex; flex-direction:column; gap:9px}
.road .wk{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--red)}
.road .ph b{font-family:Archivo; font-size:17px; font-weight:700; letter-spacing:-.015em}
.road .ph p{font-size:13.2px; color:var(--ink2); line-height:1.5}
.road .ph .o{margin-top:auto; padding-top:11px; border-top:1px dashed var(--rule2); font-family:"IBM Plex Mono"; font-size:10.5px; color:var(--muted); line-height:1.5}
@media(max-width:960px){ .road{grid-template-columns:1fr 1fr} }
@media(max-width:560px){ .road{grid-template-columns:1fr} }

/* ============ results ============ */
.res{border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin-top:34px; background:var(--paper)}
.rr{display:grid; grid-template-columns:1.55fr 1fr 1fr; align-items:center; border-bottom:1px solid var(--rule)}
.rr:last-child{border-bottom:0}
.rr.h{background:var(--band)}
.rr.h>div{font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:12px 20px}
.rr>div{padding:16px 20px}
.rr .m{font-size:15.5px; font-weight:500; color:var(--ink); font-family:Archivo; letter-spacing:-.01em}
.rr .b{font-family:"IBM Plex Mono"; font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.rr .a{font-family:"IBM Plex Mono"; font-size:15px; color:var(--teal); font-weight:500; font-variant-numeric:tabular-nums}
@media(max-width:760px){
  .rr{grid-template-columns:1fr 1fr}
  .rr.h{display:none}
  .rr .m{grid-column:1/-1; padding-bottom:2px}
  .rr .b::before{content:"now "; color:var(--rule2)}
  .rr .a::before{content:"target "; color:var(--rule2)}
}

/* ============ close ============ */
.close .cg{margin-top:44px; padding-top:28px; border-top:1px solid #2A3238; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:26px}
.close .cg .l{font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ondark2); margin-bottom:9px}
.close .cg .v{font-size:15px; line-height:1.65; color:var(--ondark)}
.close .cg .v a{color:var(--ondark); text-decoration:none; border-bottom:1px solid #3A444C}

/* client mark: real logo when supplied, plain type lockup until then */
.cl-txt{display:block; line-height:1.15}
.cl-txt b{display:block; font-family:Archivo,Arial,sans-serif; font-weight:800; font-size:14px; letter-spacing:-.01em; color:var(--ink)}
.cl-txt i{display:block; font-style:normal; font-family:"IBM Plex Mono"; font-size:8.5px; letter-spacing:.18em; color:var(--muted); margin-top:2px}
.cl-txt.lg b{font-size:26px} .cl-txt.lg i{font-size:10px; letter-spacing:.22em; margin-top:5px}
.cl-txt.lg u{display:block; text-decoration:none; font-size:14px; color:var(--muted); margin-top:6px}


/* ============ short screens: a laptop with browser chrome ============ */
@media (max-height:880px){
  .slide:not(.cov){padding:72px 5vw 52px}
  .cov .inner{padding:78px 5vw 34px}
  h2.st{font-size:clamp(26px,3.7vw,40px)}
  .cov h1{font-size:clamp(34px,5.2vw,56px)}
  .stmt h2{font-size:clamp(32px,5vw,58px); margin-top:20px}
  .stmt .pre{font-size:clamp(16px,1.7vw,20px)}
  .say{font-size:16.5px; margin-top:14px}
  .cov .say{font-size:17.5px; margin-top:20px}
  .tag{margin-bottom:16px}
  .fine{margin-top:14px; font-size:11px}
  .stats{margin-top:26px} .stats div{padding:16px 16px}
  .refwall{margin-top:24px; padding:22px 18px; gap:22px 14px}
  .grid8{margin-top:26px; gap:12px}
  .tl{padding:15px 15px 16px} .tl b{font-size:15.5px} .tl span{font-size:13.5px; margin-top:7px}
  .fig{margin-top:20px; padding:16px 18px 14px}
  .certrow{margin-top:14px; gap:16px}
  .certrow .ans{padding:16px 18px} .certrow .doc .sheet{min-height:186px}
  .cmp{margin-top:22px} .cmp .rw>div{padding:12px 18px; font-size:13.8px} .cmp .rw b{font-size:14.2px; margin-bottom:4px}
  .mech{margin-top:22px} .mech .m{padding:13px 16px} .mech .m span{font-size:13.2px}
  .road{margin-top:24px} .road .ph{padding:16px 14px} .road .ph p{font-size:12.5px}
  .res{margin-top:24px} .rr>div{padding:12px 18px} .rr .m{font-size:14.5px}
  .g3{margin-top:22px} .card{padding:18px} .card .cb{font-size:13.8px}
  .close .cg{margin-top:30px; padding-top:22px; gap:20px}
  .cov .foot{padding:16px 5vw} .cov .foot img.cl{height:46px}
}
@media (max-height:720px){
  .slide:not(.cov){padding:66px 5vw 42px}
  .cov .inner{padding:70px 5vw 26px}
  h2.st{font-size:clamp(23px,3.1vw,33px)}
  .cov h1{font-size:clamp(30px,4.4vw,46px)}
  .stmt h2{font-size:clamp(28px,4.2vw,46px)}
  .say, .cov .say{font-size:15.5px}
  .tl b{font-size:14.5px} .tl span{font-size:12.8px}
  .certrow .doc .sheet{min-height:132px}
  .certrow{margin-top:12px}
  .cmp .rw>div{padding:9px 16px; font-size:12.8px}
  .fig{margin-top:16px; padding:14px 16px 12px}
  .mech .m{padding:11px 15px} .mech .m span{font-size:12.6px}
  .rr>div{padding:10px 18px}
  .road .ph{padding:13px 12px}
  .cov .foot img.cl{height:38px} .cov .foot .lock img.gl{height:36px}
}

@media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important} }
</style>
